name: Deploy To EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout Code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # =========================
      # Build Backend Image
      # =========================
      - name: Build Backend Image
        run: |
          docker build \
            -t mohammadayan7879/pujapathvedic-backend:latest \
            ./Backend

      - name: Push Backend Image
        run: |
          docker push mohammadayan7879/pujapathvedic-backend:latest

      # =========================
      # Build Frontend Image
      # =========================
      - name: Build Frontend Image
        run: |
          docker build \
            --build-arg VITE_BACKEND_URL="${{ secrets.VITE_BACKEND_URL }}" \
            --build-arg VITE_BACKEND_FOR_URL="${{ secrets.VITE_BACKEND_FOR_URL }}" \
            --build-arg VITE_RAZORPAY_KEY_ID="${{ secrets.VITE_RAZORPAY_KEY_ID }}" \
            --build-arg VITE_VAPID_PUBLIC_KEY="${{ secrets.VITE_VAPID_PUBLIC_KEY }}" \
            -t mohammadayan7879/pujapathvedic-frontend:latest \
            ./Frontend

      - name: Push Frontend Image
        run: |
          docker push mohammadayan7879/pujapathvedic-frontend:latest

      # =========================
      # Copy docker-compose.yml
      # =========================
      - name: Copy Docker Compose To EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,nginx/*"
          target: "/home/ubuntu/pujapath"

      # =========================
      # Deploy
      # =========================
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/pujapath

            echo "Pulling latest images..."
            sudo docker compose pull

            echo "Stopping old containers..."
            sudo docker compose down

            echo "Starting new containers..."
            sudo docker compose up -d

            echo "Removing unused images..."
            sudo docker image prune -af

            echo "Deployment completed successfully"

            sudo docker ps
