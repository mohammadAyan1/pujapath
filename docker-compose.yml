services:
  backend:
    image: mohammadayan7879/pujapathvedic-backend:latest

    container_name: pujapath-backend

    ports:
      - "3000:3000"

    env_file:
      - ./.env

    restart: always

    networks:
      - app-network

    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: mohammadayan7879/pujapathvedic-frontend:latest

    container_name: pujapath-frontend

    ports:
      - "80:80"

    restart: always

    depends_on:
      - backend

    networks:
      - app-network

networks:
  app-network:
    driver: bridge
