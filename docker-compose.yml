services:
  backend:
    image: mohammadayan7879/pujapathvedic-backend:latest

    container_name: pujapath-backend

    env_file:
      - ./.env

    restart: always

    networks:
      - app-network

    depends_on:
      - redis

    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: mohammadayan7879/pujapathvedic-frontend:latest

    container_name: pujapath-frontend

    restart: always

    depends_on:
      - backend

    networks:
      - app-network

  nginx:
    image: nginx:alpine

    container_name: pujapath-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - frontend
      - backend

    restart: always

    networks:
      - app-network

  redis:
    image: redis:7-alpine

    container_name: pujapath-redis

    restart: always

    command: redis-server --appendonly yes

    volumes:
      - redis-data:/data

    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis-data:
